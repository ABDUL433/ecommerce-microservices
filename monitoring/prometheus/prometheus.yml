global:
  scrape_interval: 5s

scrape_configs:
  - job_name: ecommerce
    metrics_path: /actuator/prometheus
    static_configs:
      # the services run on your PC, Prometheus runs in Docker
      - targets:
          - host.docker.internal:8081
          - host.docker.internal:8082
          - host.docker.internal:8083
