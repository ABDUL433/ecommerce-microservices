spring.application.name=api-gateway
server.port=8080

# Secret used to sign and verify tokens (HS256 needs at least 32 characters).
# The Order Service must use the same value. Override it with the JWT_SECRET environment variable.
gateway.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
gateway.jwt.ttl-minutes=60

# Demo users. A real system would use an identity provider such as Keycloak.
gateway.users.alice.password=alice123
gateway.users.alice.customer-id=aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
gateway.users.alice.roles=USER
gateway.users.bob.password=bob123
gateway.users.bob.customer-id=bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb
gateway.users.bob.roles=USER
gateway.users.admin.password=admin123
gateway.users.admin.customer-id=cccccccc-cccc-cccc-cccc-cccccccccccc
gateway.users.admin.roles=ADMIN

# Where the services run
gateway.routes.order-url=http://localhost:8082
gateway.routes.inventory-url=http://localhost:8081
gateway.routes.payment-url=http://localhost:8083

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
